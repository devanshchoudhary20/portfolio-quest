[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

# hashed assets never change
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/resume/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/resume.pdf"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/maps/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# the fragment never reaches the server, so /#experience is redirected by a script in index.html
[[redirects]]
  from = "/resume"
  to = "/resume/"
  status = 301

[functions]
  directory = "netlify/functions"
