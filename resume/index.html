<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Devansh Choudhary, Frontend Engineer | Resume</title>
    <meta name="description" content="Resume of Devansh Choudhary, frontend engineer (React, TypeScript) at TestMu AI, formerly LambdaTest." />
    <link rel="canonical" href="https://www.devanshchoudhary.com/resume/" />
    <meta name="color-scheme" content="light dark" />
    <script>
      // runs before paint so the stored theme never flashes
      (function () {
        var root = document.documentElement;
        root.classList.add('js');
        try {
          var stored = localStorage.getItem('pq-theme');
          if (stored === 'light' || stored === 'dark') root.dataset.theme = stored;
        } catch (e) {}
      })();
    </script>
    <script type="module" src="/src/resume/main.ts"></script>
  </head>
  <body>
    <div id="app"><!--app--></div>
  </body>
</html>
